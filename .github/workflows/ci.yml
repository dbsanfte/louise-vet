name: CI and delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A production rollout must finish rather than be interrupted by another push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:unit
      - name: Check deployment validation and rollback
        run: |
          bash -n deploy/louise-deploy
          sudo python3 tests/deploy.test.py
      - name: Build and start production container
        run: docker compose up --build --detach --wait --wait-timeout 90
        env:
          REVISION: ${{ github.sha }}
      - name: Check health and missing assets
        run: |
          test "$(curl --fail --silent http://127.0.0.1:8080/healthz)" = "ok"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = "404"
      - name: Save the tested image
        env:
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/dbsanfte/vet-game:$REVISION"
          docker tag vet-game:local "$image"
          docker save "$image" -o /tmp/vet-game-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: web-image
          path: /tmp/vet-game-image.tar
          retention-days: 1
      - name: Stop containers
        if: always()
        run: docker compose down

  verify:
    needs: build
    runs-on: ubuntu-latest
    # Each shard tests the same built image, including real-time software WebGL.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: web-image
          path: /tmp
      - name: Start the shared production image
        env:
          WEB_IMAGE: ghcr.io/dbsanfte/vet-game:${{ github.sha }}
        run: |
          docker load -i /tmp/vet-game-image.tar
          docker compose up --no-build --detach --wait --wait-timeout 90 web
      - name: Test the served game
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Container logs
        if: always()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-image
          path: /tmp
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        id: publish
        env:
          REVISION: ${{ github.sha }}
        run: |
          # Keep the package name shared by build, verification and the server
          # helper stable when the GitHub repository is renamed.
          image="ghcr.io/dbsanfte/vet-game"
          docker load -i /tmp/vet-game-image.tar
          docker tag "$image:$REVISION" "$image:latest"
          docker push "$image:$REVISION"
          docker push "$image:latest"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$REVISION")
          [[ "$reference" =~ ^ghcr.io/dbsanfte/vet-game@sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "${reference##*@}" >> "$GITHUB_OUTPUT"
      - name: Verify anonymous registry access
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          registry_config=$(mktemp -d)
          trap 'rm -rf "$registry_config"' EXIT
          docker --config "$registry_config" manifest inspect "ghcr.io/dbsanfte/vet-game@$IMAGE_DIGEST" > /dev/null

  deploy:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, louise-vet-deploy]
    # Includes certificate readiness and enough time for a failed-rollout rollback.
    timeout-minutes: 15
    environment:
      name: production
      url: https://louise.vet/
    concurrency:
      group: louise-vet-production
      cancel-in-progress: false
    steps:
      - name: Deploy the published GHCR digest to k3s
        env:
          REVISION: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: sudo /usr/local/sbin/louise-deploy "$REVISION" "$IMAGE_DIGEST"

  live-check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public HTTPS and deployed revision
        env:
          REVISION: ${{ github.sha }}
        run: |
          test "$(curl --fail --silent --show-error --retry 6 --retry-delay 10 https://louise.vet/healthz)" = "ok"
          curl --fail --silent --show-error https://louise.vet/ | grep -F "Louise's Vet Office"
          curl --fail --silent --show-error https://louise.vet/version.json | jq -e --arg revision "$REVISION" '.revision == $revision'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://louise.vet/assets/missing.js)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' http://louise.vet/)" = "https://louise.vet/"
